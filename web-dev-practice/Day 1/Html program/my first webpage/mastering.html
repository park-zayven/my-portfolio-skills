<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>   
        .container{
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .container div{
            width: 200px;
            border: 1px solid black;
            height: 100px;
        }
        @media(max-width:768px){
        .container{
            flex-direction:column;
        }
    }
    </style>
</head>
<body>
    <div class="container">
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
    </div>
</body>
</html>
